name: console-spa

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref in agent-sandbox-platform to build (branch / tag / sha)"
        required: false
        default: "main"

jobs:
  spa:
    name: build web/console (Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private platform repo
        uses: actions/checkout@v4
        with:
          repository: talon-org/agent-sandbox-platform
          token: ${{ secrets.GH_PAT }}
          ref: ${{ github.event.inputs.ref || 'main' }}
          sparse-checkout: |
            web/console
            scripts/build

      - name: Set up Node + pnpm
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g pnpm@9

      - name: Install + build
        working-directory: web/console
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: console-dist
          path: web/console/dist
          if-no-files-found: error
          retention-days: 14
