name: console-spa

on:
  workflow_dispatch:
    inputs:
      console-ref:
        description: "Git ref in talon-sandbox-console to build (branch / tag / sha)"
        required: false
        default: "main"

jobs:
  spa:
    name: build talon-sandbox-console (Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout console repo
        uses: actions/checkout@v4
        with:
          repository: talon-org/talon-sandbox-console
          ref: ${{ github.event.inputs.console-ref || 'main' }}

      - name: Set up Node + pnpm
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g pnpm@9

      - name: Install + build
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: console-dist
          path: dist
          if-no-files-found: error
          retention-days: 14
